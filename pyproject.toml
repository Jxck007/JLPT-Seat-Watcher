[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jlpt-seat-watcher"
version = "1.0.0"
description = "Fault-tolerant JLPT Chennai N4 seat availability monitor"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "Jegadeesh (Jack) Nandakumar"}]
dependencies = [
  "beautifulsoup4==4.13.4",
  "filelock==3.18.0",
  "playwright==1.54.0",
  "python-dotenv==1.1.1",
  "requests==2.32.4",
]

[project.scripts]
jlpt-seat-watcher = "jlpt_seat_watcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["jlpt_seat_watcher"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=jlpt_seat_watcher --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
markers = ["live: accesses the live JLPT website"]

[tool.coverage.run]
branch = true
source = ["jlpt_seat_watcher"]

