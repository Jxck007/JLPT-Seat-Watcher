name: Monitor JLPT N4 seats

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_notification_test:
        description: Send a clearly labelled high-priority ntfy test
        required: false
        type: boolean
        default: false
      force_scraper_test:
        description: Run a live scraper test without changing state or notifying
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: jlpt-n4-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Kolkata' }}
      CHECK_INTERVAL: "900"
      HEARTBEAT_INTERVAL: "3600"
      REPEAT_AVAILABLE_ALERTS: "true"
      AVAILABLE_ALERT_INTERVAL: "900"
      QUIET_HEARTBEAT: "true"
      ENABLE_PLAYWRIGHT: "true"
      ENABLE_SCREENSHOT: "true"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore Playwright browser
        id: browser-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}

      - name: Install application
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if [[ "${{ steps.browser-cache.outputs.cache-hit }}" != "true" ]]; then
            playwright install chromium
          fi

      - name: Restore monitor state
        id: state-cache
        uses: actions/cache/restore@v5
        with:
          path: data/state.json
          key: jlpt-state-${{ github.run_id }}
          restore-keys: |
            jlpt-state-

      - name: Run forced scraper test
        if: inputs.force_scraper_test == true
        run: python -m jlpt_seat_watcher scraper-test

      - name: Run forced notification test
        if: inputs.force_notification_test == true
        run: python -m jlpt_seat_watcher notify-test --priority high

      - name: Run scheduled monitor
        if: inputs.force_scraper_test != true && inputs.force_notification_test != true
        shell: bash
        run: |
          if [[ -z "${NTFY_TOPIC}" ]]; then
            {
              echo "## JLPT N4 monitor"
              echo
              echo "> [!WARNING]"
              echo "> NTFY_TOPIC is not configured. The scraper was validated, but notifications and state changes were skipped."
              echo
            } >> "${GITHUB_STEP_SUMMARY}"
            python -m jlpt_seat_watcher scraper-test
          else
            python monitor.py
          fi

      - name: Save monitor state
        if: always() && hashFiles('data/state.json') != ''
        uses: actions/cache/save@v5
        with:
          path: data/state.json
          key: jlpt-state-${{ github.run_id }}

      - name: Record execution metadata
        if: always()
        shell: bash
        run: |
          {
            echo
            echo "### Execution"
            echo "- Trigger: \`${GITHUB_EVENT_NAME}\`"
            echo "- Run: [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo "- UTC completed: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish live dashboard data
        if: always()
        env:
          DASHBOARD_WORKFLOW_STATUS: ${{ job.status }}
          DASHBOARD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          export DASHBOARD_COMMIT_COUNT="$(git rev-list --count HEAD)"
          python scripts/publish_dashboard.py \
            --state data/state.json \
            --docs docs \
            --check-interval 900 \
            --heartbeat-interval 3600 \
            --timezone "${TIMEZONE}" \
            --max-checks 500

          git add docs/status.json docs/history.json docs/history.csv docs/metrics.json docs/health.json
          if git diff --cached --quiet; then
            echo "Dashboard data is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(dashboard): publish monitor run ${GITHUB_RUN_NUMBER}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jlpt-monitor-failure-${{ github.run_id }}
          path: |
            logs/
            data/state.json
          if-no-files-found: warn
          retention-days: 14
